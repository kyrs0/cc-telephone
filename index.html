<!-- Vue téléphone du Command Center V4 (03/11/2026, Tom : « je veux avoir le design du Command
     Center sur mon tél »). Servie par telephone.js sur le Wi-Fi de la maison, en lecture seule ;
     les chiffres viennent de « Command Center — chiffres.json ». Depuis le 04/11/2026 (choix de Tom,
     « un grand truc, vraiment, avec des graphiques ») : Capital (le grand chiffre, sa courbe et le couloir,
     objectifs, répartition, patrimoine, mes poches), Situation (ce qui coince, ce qui va), À faire (le mois
     dans l’ordre du guide v12), Dépenses (dépensé / prévu, prélèvements de la paie) et Stats façon Apple
     Santé. Le moteur calcule tout (aFaire, situation, historique) ; ici on ne fait que dessiner. -->
<style>
  :root { --fond: #0e0f11; --carte: #15161a; --bord: #222429; --texte: #f3f4f6; --doux: #8d929c; --pos: #3ecf8e; --neg: #ff6b6b; --or: #f5b83d;
    --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
    --titre: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.45 var(--sys); -webkit-text-size-adjust: 100%; }
  body { padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 86px); min-height: 100vh; }
  .tete { display: flex; align-items: center; gap: 10px; padding: 6px 0 14px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(140deg, #2b2e35, #17181c); display: grid; place-items: center; font: 800 13px/1 var(--titre); color: #fff; letter-spacing: .02em; position: relative; }
  .logo::after { content: "V4"; position: absolute; bottom: -5px; font: 700 7px/1 var(--sys); color: #111; background: var(--or); border-radius: 3px; padding: 1.5px 3px; }
  .tete h1 { margin: 0; font: 700 20px/1.1 var(--titre); letter-spacing: -.01em; }
  .tete small { display: block; color: var(--doux); font-size: 12px; font-weight: 500; margin-top: 2px; }
  .maj { margin-left: auto; border: 1px solid var(--bord); background: #17181b; color: var(--texte); border-radius: 999px; width: 38px; height: 38px; font-size: 18px; }
  .maj.tourne { animation: tour .8s linear infinite; } @keyframes tour { to { transform: rotate(360deg); } }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .carte h2 { margin: 0 0 10px; font: 650 13px/1.2 var(--sys); color: var(--doux); text-transform: uppercase; letter-spacing: .06em; }
  .ligne { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--bord); }
  .ligne:first-of-type { border-top: 0; }
  .ligne span { color: var(--doux); } .ligne b { font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .ligne b em { white-space: normal; }
  .ligne > span { min-width: 0; } .ligne > b { min-width: 0; max-width: 70%; overflow-wrap: anywhere; }
  .liste { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #1c2a40; } .liste:first-of-type { border-top: 0; } .liste span { color: #8fb3ff; font-weight: 700; min-width: 14px; }
  .ligne em { font-style: normal; display: block; font-size: 12px; color: var(--doux); font-weight: 500; }
  .pos { color: var(--pos) !important; } .neg { color: var(--neg) !important; } .dim { color: var(--doux); }
  .gros { font: 750 40px/1.05 var(--titre); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .sous { color: var(--doux); font-size: 13px; margin-top: 6px; } .sous b { color: var(--texte); font-weight: 650; }
  .barre { height: 8px; border-radius: 99px; background: #23252a; overflow: hidden; margin: 10px 0 4px; } .barre i { display: block; height: 100%; border-radius: 99px; }
  .note { color: var(--doux); font-size: 12px; line-height: 1.5; margin: 8px 2px 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 8px; border-radius: 99px; background: #2a2c31; color: #c9ccd3; margin: 2px 4px 0 0; white-space: nowrap; }
  .pill.o { background: rgba(245,184,61,.15); color: var(--or); }
  .alerte { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--bord); font-size: 14px; } .alerte:first-of-type { border-top: 0; }
  .alerte i { width: 8px; height: 8px; border-radius: 50%; background: var(--or); margin-top: 7px; flex: 0 0 auto; }
  .vide { color: var(--doux); text-align: center; padding: 40px 10px; }
  .grille2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .grille2 .carte { margin-bottom: 0; }
  .seg { display: inline-flex; background: #17181b; border: 1px solid #232428; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: #9aa0aa; padding: 6px 14px; border-radius: 999px; font: 600 13px var(--sys); }
  .seg button.on { background: var(--texte); color: var(--fond); }
  .kpi span { display: block; color: var(--doux); font-size: 12px; } .kpi b { font: 700 20px/1.2 var(--titre); font-variant-numeric: tabular-nums; }
  /* Dépenses : le Budget façon Actual (violet) */
  .p-depenses .carte { background: #17151c; border-color: #2a2433; } .p-depenses h2 { color: #b28ce8; } .p-depenses .ligne, .p-depenses .pli { border-color: #2a2433; }
  .heros > span { color: var(--doux); font-size: 13px; } .heros .gros { margin: 2px 0; }
  .env { padding: 10px 0; border-top: 1px solid var(--bord); } .env:first-of-type { border-top: 0; }
  .env-h { display: flex; justify-content: space-between; gap: 10px; } .env-h b { font-weight: 650; } .env-h strong { font-variant-numeric: tabular-nums; }
  .env small { color: var(--doux); font-size: 12px; } .env .barre { margin: 7px 0 3px; background: #2a2433; height: 6px; }
  /* lignes à déplier (mes poches, abonnements, charges fixes…) */
  .pli { border-top: 1px solid var(--bord); } .pli:first-of-type { border-top: 0; } .carte > .pli:only-child { border-top: 0; }
  .pli summary { list-style: none; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 0; cursor: pointer; }
  .pli summary::-webkit-details-marker { display: none; }
  .pli summary b { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pli summary b::after { content: "›"; display: inline-block; margin-left: 8px; color: var(--doux); transition: transform .15s; }
  .pli[open] summary b::after { transform: rotate(90deg); }
  .pli-t { font-weight: 600; min-width: 0; } .pli-t em { display: block; font-style: normal; font-size: 12px; color: var(--doux); font-weight: 500; }
  .pli-c { padding: 0 0 10px; }
  /* À faire : façon M1 Finance (bleu nuit) */
  .p-afaire .carte { background: #0f1828; border-color: #1c2a40; } .p-afaire h2 { color: #8fb3ff; } .p-afaire .ligne, .p-afaire .pli, .p-afaire .tache, .p-afaire .env { border-color: #1c2a40; }
  .tache { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--bord); } .tache:first-of-type { border-top: 0; }
  .tache > i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #3a4a66; flex: 0 0 auto; display: grid; place-items: center; font: 800 12px/1 var(--sys); font-style: normal; color: var(--fond); }
  .tache.fait > i { background: var(--pos); border-color: var(--pos); }
  .tache > div { min-width: 0; flex: 1; } .tache b { display: block; font-weight: 650; } .tache small { display: block; color: var(--doux); font-size: 12px; margin-top: 1px; }
  .tache strong { font-variant-numeric: tabular-nums; white-space: nowrap; } .tache.fait b, .tache.fait strong { color: var(--doux); }
  .or { color: var(--or); }
  nav button { position: relative; }
  .pastille { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--neg); color: #fff; font: 700 10.5px/17px var(--sys); padding: 0 4px; }
  /* graphiques (SVG dessinés dans la page) */
  .graph { display: block; width: 100%; height: auto; margin-top: 12px; overflow: visible; }
  .graph text { fill: var(--doux); font: 600 10px var(--sys); } .graph text.g-futur { fill: #5d626b; }
  .g-ligne { stroke: #26282d; stroke-width: 1; } .g-bande { fill: rgba(124,196,255,.13); stroke: rgba(124,196,255,.35); stroke-width: 1; stroke-dasharray: 3 3; }
  .legende { display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--doux); } .legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .legende .l-bande { background: rgba(124,196,255,.25); border: 1px dashed rgba(124,196,255,.6); }
  .anneau { display: block; flex: 0 0 auto; } .anneau .a-v { fill: var(--texte); font: 750 19px var(--titre); } .anneau .a-s { fill: var(--doux); font: 600 11px var(--sys); }
  .duo { display: flex; align-items: center; gap: 16px; } .duo > div { flex: 1; min-width: 0; text-align: center; } .duo > div > small { display: block; color: var(--doux); font-size: 12px; margin-top: 4px; } .duo .anneau { margin: 0 auto; }
  .duo > .leg-v, .duo > div:has(.gros) { text-align: left; }
  .leg-v > div { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; } .leg-v i { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; display: inline-block; }
  .leg-v span { flex: 1; color: var(--doux); } .leg-v b { font-variant-numeric: tabular-nums; } .leg-v em { font-style: normal; color: var(--doux); font-size: 12px; min-width: 34px; text-align: right; }
  .leg-v .lv-b { display: block; padding: 6px 0; } .lv-b span { display: inline-flex; align-items: center; gap: 7px; } .lv-b b { float: right; font-size: 13px; }
  .jauge { position: relative; height: 8px; border-radius: 99px; background: #2a2c31; margin: 7px 0 3px; overflow: hidden; } .jauge i { display: block; height: 100%; border-radius: 99px; }
  .jauge u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .85; }
  .grille3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; } .grille3 .carte { margin: 0; padding: 12px 10px; }
  .grille3 .kpi b { font-size: 18px; } .grille3 .kpi span { font-size: 11px; }
  .heros-cap > span { color: var(--doux); font-size: 13px; } .heros-cap .gros { font-size: 46px; margin: 2px 0; }
  .couloir { position: relative; height: 14px; border-radius: 99px; background: linear-gradient(90deg, rgba(255,107,107,.35), rgba(62,207,142,.45) 40%, rgba(62,207,142,.45) 70%, rgba(124,196,255,.5)); margin: 8px 0 4px; }
  .couloir i { position: absolute; top: -5px; width: 6px; height: 24px; border-radius: 3px; background: #fff; transform: translateX(-50%); box-shadow: 0 0 0 2px #15161a; }
  .couloir-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--doux); }
  .pt { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; vertical-align: 0; }
  /* Situation */
  .sit { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--bord); color: var(--texte); padding: 11px 0 11px 12px; font: inherit; position: relative; }
  .sit:first-of-type { border-top: 0; } .sit::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--c); }
  .sit-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; } .sit-h span { font-weight: 650; } .sit-h i { display: none; } .sit-h b { color: var(--c); font-variant-numeric: tabular-nums; text-align: right; }
  .sit small { display: block; color: var(--doux); font-size: 12px; margin-top: 2px; } .sit .barre { height: 6px; margin: 6px 0 2px; }
  /* À faire : dimanches, étiquettes, relevés */
  .dims { display: flex; gap: 8px; margin: 4px 0 2px; } .dims i { flex: 1; height: 10px; border-radius: 99px; background: #23324d; } .dims i.on { background: #f6a623; }
  .et { display: inline-block; font: 650 10.5px/1 var(--sys); padding: 3px 7px; border-radius: 99px; background: #23252a; color: var(--doux); vertical-align: 2px; margin-left: 4px; }
  .et.or { background: rgba(245,184,61,.16); color: var(--or); } .et.bleu { background: rgba(124,196,255,.14); color: #8fb3ff; } .et.vert { background: rgba(62,207,142,.14); color: var(--pos); }
  .tache b { display: inline; } .tache > div > b { display: block; }
  .tache.maint > i { border-color: var(--or); border-width: 3px; } .tache.maint > div > b { color: var(--texte); }
  .tache.auto > i { border-color: #4b6ea8; color: #8fb3ff; font-size: 13px; } .tache.rappel > i { border-style: dashed; }
  .puces { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; } .puces span { font: 600 11.5px var(--sys); padding: 3px 9px; border-radius: 99px; background: #1b2436; color: var(--doux); } .puces span.ok { background: rgba(62,207,142,.15); color: var(--pos); }
  .carte h2 em { float: right; font-style: normal; text-transform: none; letter-spacing: 0; color: var(--doux); font-weight: 600; }
  /* Capital : façon Finary (vert) */
  .p-capital h2 { color: #6fdcb0; }
  /* Crypto (dans « Mes poches ») */
  .coin { display: flex; align-items: center; gap: 12px; } .coin .rond { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 15px/1 var(--titre); color: #fff; flex: 0 0 auto; }
  .coin h3 { margin: 0; font: 700 17px/1.2 var(--titre); } .coin h3 small { color: var(--doux); font: 600 12px var(--sys); margin-left: 6px; }
  .coin .v { margin-left: auto; text-align: right; } .coin .v b { font: 700 18px/1.2 var(--titre); font-variant-numeric: tabular-nums; display: block; }
  .pru { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .pru div { background: #1b1d22; border-radius: 12px; padding: 10px 12px; } .pru span { display: block; color: var(--doux); font-size: 12px; } .pru b { font: 700 17px/1.3 var(--titre); font-variant-numeric: tabular-nums; }
  /* Stats : façon Apple Santé (une couleur par mesure) */
  .p-stats .carte { background: #1c1c1e; border-color: #2c2c2e; }
  .p-stats h2 { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 15px; }
  .p-stats h2 i { width: 22px; height: 22px; border-radius: 6px; display: inline-block; flex: 0 0 auto; }
  .p-stats h2 em { margin-left: auto; font-style: normal; color: var(--doux); font-size: 12px; font-weight: 500; }
  .val { font: 750 32px/1.1 var(--titre); font-variant-numeric: tabular-nums; } .val small { font: 600 15px var(--sys); color: var(--doux); margin-left: 4px; }
  .mb { display: flex; align-items: flex-end; gap: 5px; height: 54px; margin-top: 10px; }
  .mb div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .mb i { width: 100%; border-radius: 4px 4px 2px 2px; min-height: 3px; } .mb span { font-size: 9.5px; color: var(--doux); }
  /* barre d'onglets */
  /* Mois : le point du mois (08/11/2026) — pont, MSCI World, mouvements ; et les paliers du Capital */
  .p-mois h2 { color: #f5c76b; }
  .pont-l { display: grid; grid-template-columns: 92px 1fr 86px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--bord); font-size: 14px; } .pont-l:first-of-type { border-top: 0; }
  .pont-l span { color: var(--doux); } .pont-l b { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pont-l.tot span, .pont-l.tot b { color: var(--texte); font-weight: 700; }
  .pb { position: relative; height: 10px; background: #1c1d21; border-radius: 4px; } .pb::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: #3a3c42; }
  .pb i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .mv { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--bord); font-size: 14px; } .mv:first-of-type { border-top: 0; }

  .wl-l { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--bord); } .wl-l:first-of-type { border-top: 0; } .wl-l > i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; } .wl-l > div:nth-child(2) { flex: 1; min-width: 0; }
  .wl-l b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .wl-l small { display: block; color: var(--doux); font-size: 12px; } .wl-p { text-align: right; } .wl-p b { font-variant-numeric: tabular-nums; }
  .route { margin: 16px 6px 4px; } .r-piste { position: relative; height: 14px; background: #1c1d21; border-radius: 99px; } .r-piste > i { position: absolute; left: 0; top: 0; bottom: 0; min-width: 14px; border-radius: 99px; background: linear-gradient(90deg, #f7c96b, #f5a623); }
  .r-pt { position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%; background: #1c1d21; border: 1.5px solid #4a4d55; transform: translate(-50%, -50%); } .r-pt.gd { width: 9px; height: 9px; } .r-pt.fait { background: #fff; border-color: #fff; }

  .r-pro { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; } .r-pro small { display: block; color: var(--doux); font-size: 11.5px; } .r-pro b { font: 750 18px/1.25 var(--titre); }

  .pal.fait { background: rgba(62,207,142,.12); } .pal.fait b { color: var(--pos); } .pal.courant { border-color: var(--or); } .pal em { display: block; font-style: normal; font-size: 11px; color: var(--or); margin-top: 4px; }

<body>
<header class="tete"><div class="logo">CC</div><div><h1 id="titre">Command Center</h1><small id="maj">…</small></div><button class="maj" id="rafraichir" aria-label="Mettre à jour">↻</button></header>

<nav id="onglets"></nav>
<script>
(function () {
  'use strict';
  // [id, nom dans la barre, icône, question en titre]
  var ONGLETS = [
    ['capital', 'Capital', '<path d="M4 19V11M9.5 19V6M15 19v-5M20.5 19V9"/>', 'Capital'],

    ['stats', 'Stats', '<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>', 'Stats'],
  ];
  var J = null, onglet = 'capital';
  /* Appli publiée sur GitHub (02-03/11/2026) : les chiffres arrivent chiffrés depuis cette adresse ;
     sans elle (Wi-Fi), ils viennent du PC en clair (« donnees »). */
  var SOURCE = (document.querySelector('meta[name="cc-donnees"]') || {}).content || null;
  var stock = { lire: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, ecrire: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* rien */ } } };
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var vers64 = function (u) { var s = ''; u = new Uint8Array(u); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  // window.crypto : l'onglet « crypto » (fonction plus bas) porte le même nom dans ce fichier
  var subtle = window.crypto && window.crypto.subtle;
  function cleDepuisMotDePasse(mdp, env) {
    if (!subtle) return Promise.reject(new Error('Ce navigateur ne sait pas déchiffrer (ouvre l’appli en https).'));
    return subtle.importKey('raw', new TextEncoder().encode(mdp), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(env.sel), iterations: env.iter }, k, 256); });

  function dechiffrer(cleBrute, env) {
    if (!subtle) return Promise.reject(new Error('Ce navigateur ne sait pas déchiffrer (ouvre l’appli en https).'));
    return subtle.importKey('raw', cleBrute, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return subtle.decrypt({ name: 'AES-GCM', iv: b64(env.iv) }, k, b64(env.donnees)); })
      .then(function (o) { return JSON.parse(new TextDecoder().decode(o)); });
  }
  var enveloppe = null;   // le dernier fichier chiffré reçu (gardé sur le téléphone pour le hors ligne)
  try { onglet = localStorage.getItem('cc-tel-onglet') || 'capital'; } catch (e) { /* stockage indisponible */ }
  if (!ONGLETS.some(function (o) { return o[0] === onglet; })) onglet = 'capital';   // anciens onglets (accueil, budget, ou…) → le premier

  var nf = function (d) { return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  function n(v, d) { return v == null || !isFinite(v) ? '—' : nf(d == null ? 2 : d).format(v); }
  // espaces insécables avant €, $ et % : un montant ne se coupe jamais en deux lignes
  function eur(v, d) { return v == null || !isFinite(v) ? '—' : n(v, d == null ? (Math.abs(v) >= 1000 ? 0 : 2) : d) + ' €'; }
  function eurS(v, d) { return v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + eur(Math.abs(v), d); }
  function usd(v, d) { return v == null || !isFinite(v) ? '—' : n(v, d == null ? (v < 100 ? 2 : 0) : d) + ' $'; }
  function pct(v, d) { return v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : '') + n(v, d == null ? 1 : d) + ' %'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function mois(iso) { if (!iso) return '—'; var p = iso.split('-'); return MOIS[+p[1] - 1] + ' ' + p[0]; }
  function date(iso) { if (!iso) return '—'; var p = String(iso).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function cls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : ''; }
  function ligne(l, v, sous) { return '<div class="ligne"><span>' + l + '</span><b>' + v + (sous ? '<em>' + sous + '</em>' : '') + '</b></div>'; }
  function barre(p, c) { return '<div class="barre"><i style="width:' + Math.max(0, Math.min(100, p || 0)).toFixed(1) + '%;background:' + c + '"></i></div>'; }
  var g = function (o, k) { return k.split('.').reduce(function (a, x) { return a == null ? null : a[x]; }, o); };

  function depuis(iso) {
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (!isFinite(m)) return '';
    if (m < 2) return 'à l’instant'; if (m < 60) return 'il y a ' + m + ' min';
    var h = Math.round(m / 60); if (h < 24) return 'il y a ' + h + ' h';
    return 'le ' + date(iso);
  }

  /* Cinq onglets (04/11/2026, Tom : « un grand truc, vraiment, avec des graphiques, des trucs visuels ») :
     Capital (le grand chiffre et ses graphiques), Situation (ce qui coince, ce qui va), À faire (le mois
     dans l'ordre du guide v12), Dépenses (dépensé / prévu, prélèvements de la paie) et Stats. Tout est
     calculé par le moteur (chiffres.json) ; ici, on ne fait que dessiner. */
  var COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  var JOURS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  var NIV = { ko: '#ff6b6b', surveiller: '#f5b83d', ok: '#3ecf8e', neutre: '#8d929c' };
  var POCHES = [['trading', 'Trading', '#40c8e0'], ['crypto', 'Crypto', '#f6a623'], ['pea', 'PEA', '#2bb3a3'], ['livret', 'Livret A', '#8e6bdb']];
  function dIso(iso) { var p = String(iso).slice(0, 10).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
  function jour(iso) { if (!iso) return '—'; var d = dIso(iso); return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + COURTS[d.getMonth()]; }
  function joursAvant(iso) { var a = new Date(); a.setHours(0, 0, 0, 0); return Math.round((dIso(iso) - a) / 864e5); }
  function dans(iso) { var k = joursAvant(iso); return k < 0 ? 'passé' : k === 0 ? 'aujourd’hui' : k === 1 ? 'demain' : 'dans ' + k + ' jours'; }
  function moisNom(iso) { return iso ? MOIS[+iso.split('-')[1] - 1] : '—'; }
  function deMois(iso) { var m = moisNom(iso); return (/^[aeiouyéèh]/i.test(m) ? 'd’' : 'de ') + m; }   // d’octobre, de novembre
  function court(iso) { return COURTS[+String(iso).split('-')[1] - 1]; }
  function ke(v) { return v == null || !isFinite(v) ? '—' : Math.abs(v) >= 1000 ? n(v / 1000, 1).replace(',0', '') + ' k€' : n(v, 0) + ' €'; }
  function pli(titre, valeur, sous, corps, ouvert) {
    return '<details class="pli"' + (ouvert ? ' open' : '') + '><summary><span class="pli-t">' + titre + (sous ? '<em>' + sous + '</em>' : '') + '</span><b>' + valeur + '</b></summary><div class="pli-c">' + corps + '</div></details>';
  }

  /* ── Petits graphiques en SVG (rien à charger) ── */
  var GW = 340;
  // courbe d'une série mensuelle, avec une bande (couloir) facultative et des mois à venir
  function courbe(points, o) {
    o = o || {};
    var H = o.h || 160, pT = 16, pB = 22, pL = 6, pR = 40;
    var labels = points.map(function (p) { return p.iso; });
    (o.bande || []).forEach(function (b) { if (labels.indexOf(b.iso) < 0) labels.push(b.iso); });
    labels.sort();
    var vals = points.map(function (p) { return p.y; });
    (o.bande || []).forEach(function (b) { vals.push(b.basse, b.haute); });
    var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if (o.zero) mn = Math.min(0, mn);
    if (mx === mn) mx = mn + 1;
    var marge = (mx - mn) * 0.08; mx += marge; if (!o.zero) mn -= marge; if (o.zero && mn > 0) mn = 0;
    var X = function (i) { return pL + (GW - pL - pR) * (labels.length > 1 ? i / (labels.length - 1) : 0.5); };
    var Y = function (v) { return pT + (H - pT - pB) * (1 - (v - mn) / (mx - mn)); };
    var ix = function (iso) { return labels.indexOf(iso); };
    var s = '<svg class="graph" viewBox="0 0 ' + GW + ' ' + H + '">';
    for (var k = 0; k <= 2; k++) { var v = mn + (mx - mn) * (1 - k / 2), gy = Y(v); s += '<line x1="' + pL + '" x2="' + (GW - pR + 4) + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" class="g-ligne"/><text x="' + (GW - 2) + '" y="' + (gy + 3.5).toFixed(1) + '" text-anchor="end">' + ke(v) + '</text>'; }
    if (o.bande && o.bande.length) {
      var b = o.bande.filter(function (x) { return ix(x.iso) >= 0; });
      s += '<path class="g-bande" d="M' + b.map(function (x) { return X(ix(x.iso)).toFixed(1) + ' ' + Y(x.haute).toFixed(1); }).join(' L') + ' L' + b.slice().reverse().map(function (x) { return X(ix(x.iso)).toFixed(1) + ' ' + Y(x.basse).toFixed(1); }).join(' L') + ' Z"/>';
    }
    var pts = points.map(function (p) { return [X(ix(p.iso)), Y(p.y)]; });
    if (pts.length) {
      var ligneD = 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');
      s += '<path d="' + ligneD + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - pB) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - pB) + ' Z" fill="' + o.couleur + '" fill-opacity=".16"/>'
        + '<path d="' + ligneD + '" fill="none" stroke="' + o.couleur + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'
        + '<circle cx="' + pts[pts.length - 1][0].toFixed(1) + '" cy="' + pts[pts.length - 1][1].toFixed(1) + '" r="4" fill="' + o.couleur + '" stroke="#15161a" stroke-width="2"/>';
    }
    var pas = Math.max(1, Math.ceil(labels.length / 6));
    labels.forEach(function (iso, i) { if ((i % pas === 0 && labels.length - 1 - i >= pas * 0.6) || i === labels.length - 1) s += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (points.some(function (p) { return p.iso === iso; }) ? '' : ' class="g-futur"') + '>' + court(iso) + '</text>'; });
    return s + '</svg>';
  }
  // anneau : la part d'un tout (donut à plusieurs parts, ou une jauge)
  function anneau(parts, centre, sous, taille) {
    var t = taille || 140, r = t / 2 - 12, c = 2 * Math.PI * r, tot = 0, off = 0;
    parts.forEach(function (p) { tot += Math.max(0, p.v); });
    var total = parts.length === 1 ? Math.max(tot, parts[0].sur || tot) : tot || 1;
    var s = '<svg class="anneau" viewBox="0 0 ' + t + ' ' + t + '" width="' + t + '" height="' + t + '"><circle cx="' + t / 2 + '" cy="' + t / 2 + '" r="' + r + '" fill="none" stroke="#23252a" stroke-width="13"/>';
    parts.forEach(function (p) {
      var l = Math.max(0, p.v) / total * c; if (l <= 0) return;
      var trait = parts.length > 1 ? Math.max(0.5, l - 2.5) : Math.max(0.5, l);
      s += '<circle cx="' + t / 2 + '" cy="' + t / 2 + '" r="' + r + '" fill="none" stroke="' + p.c + '" stroke-width="13" stroke-linecap="' + (parts.length > 1 ? 'butt' : 'round') + '" stroke-dasharray="' + trait.toFixed(1) + ' ' + (c - trait).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '" transform="rotate(-90 ' + t / 2 + ' ' + t / 2 + ')"/>';
      off += l;
    });
    return s + '<text x="50%" y="' + (t / 2 + (sous ? 0 : 6)) + '" text-anchor="middle" class="a-v">' + centre + '</text>' + (sous ? '<text x="50%" y="' + (t / 2 + 17) + '" text-anchor="middle" class="a-s">' + sous + '</text>' : '') + '</svg>';
  }
  // barre « dépensé sur prévu » : le trait blanc marque le prévu, le rouge déborde
  function jauge(valeur, sur, couleur) {
    var max = Math.max(valeur, sur, 0.01), p = Math.max(0, valeur) / max * 100, m = sur / max * 100;
    return '<div class="jauge"><i style="width:' + p.toFixed(1) + '%;background:' + couleur + '"></i>' + (valeur > sur && sur > 0 ? '<u style="left:' + m.toFixed(1) + '%"></u>' : '') + '</div>';
  }
  function barresV(vals, etiquettes, couleur, ligne) {
    var max = Math.max.apply(null, [1, ligne || 0].concat(vals.map(function (v) { return Math.abs(v || 0); })));
    return '<div class="mb">' + vals.map(function (v, i) { return '<div><i style="height:' + Math.max(3, Math.abs(v || 0) / max * 100).toFixed(0) + '%;background:' + (typeof couleur === 'function' ? couleur(v, i) : couleur) + '"></i><span>' + esc(etiquettes[i] || '') + '</span></div>'; }).join('') + '</div>';
  }

  /* ── 1. Capital ── */
  var vue = stock.lire('cc-vue') || 'net';
  function capital() {
    var C = J.capital || {}, A = C.auCours || {}, Ob = J.objectif || {}, B = J.banque || {}, Hc = g(J, 'historique.capital') || [], Hp = g(J, 'historique.patrimoine') || [];
    var cou = J.couloir || {}, Bc = g(J, 'bilan.couloir') || {}, L = J.livret || {}, Mt = L.matelas || {};
    var p100 = A.total ? A.total / (Ob.montant || 100000) * 100 : 0;
    var du10 = g(C, 'du10.total'), prec = Hc.length > 1 ? Hc[Hc.length - 2] : null;
    var h = '<section class="carte heros-cap"><span>Capital investi · aujourd’hui</span><div class="gros">' + eur(A.total, 0) + '</div>'
      + '<div class="sous">' + (prec ? '<span class="' + cls(du10 - prec.total) + '" style="font-weight:650">' + eurS(du10 - prec.total, 0) + '</span> sur le dernier mois · ' : '') + 'figé au 10 : <b>' + eur(du10, 0) + '</b></div>';
    // capital du 10 mois par mois, et le couloir du plan pour les 3 mois qui viennent
    var dernierIso = Hc.length ? Hc[Hc.length - 1].iso : null;
    var bande = (cou.mois || []).filter(function (m) { return Hc.some(function (x) { return x.iso === m.iso; }) || (dernierIso && m.iso > dernierIso && m.iso <= addMois(dernierIso, 3)); });
    if (Hc.length > 1) h += courbe(Hc.map(function (x) { return { iso: x.iso, y: x.total }; }), { couleur: '#3ecf8e', bande: bande, h: 170, zero: true })
      + '<div class="legende"><span><i style="background:#3ecf8e"></i>capital du 10</span><span><i class="l-bande"></i>couloir du plan</span></div>';
    h += '</section>';
    // trois chiffres
    var argent = (B.total || 0) + (L.solde || 0);
    var Ac = J.accueil || {}, net = g(Ac, 'releve.net'), netPre = g(Ac, 'precedent.net');
    h += '<div class="grille3"><section class="carte kpi"><span>Patrimoine net</span><b>' + ke(net) + '</b><span class="' + cls(net - netPre) + '">' + eurS(net - netPre, 0) + '</span></section>'
      + '<section class="carte kpi"><span>Argent dispo</span><b>' + ke(argent) + '</b><span>banque + livret</span></section>'
      + '<section class="carte kpi"><span>Investi / mois</span><b>' + ke(Ob.investiParMois3Mois) + '</b><span>sur 3 mois</span></section></div>';
    // objectif et matelas en anneaux
    h += '<section class="carte"><h2>Objectifs</h2><div class="duo"><div>' + anneau([{ v: p100, sur: 100, c: '#3ecf8e' }], n(p100, 1) + ' %', 'de 100 k€', 128) + '<small>100 000 € le ' + date(Ob.date) + '</small></div>'
      + '<div>' + anneau([{ v: Mt.pct || 0, sur: 100, c: '#8e6bdb' }], n(Mt.pct, 0) + ' %', 'matelas', 128) + '<small>' + eur(Mt.solde, 0) + ' sur ' + eur(Mt.cible, 0) + '</small></div></div></section>';
    h += reperesCapital();   // paliers, répartition cible, liquidités, projet (08/11/2026)
    // répartition
    var parts = POCHES.map(function (p) { return { v: A[p[0]] || 0, c: p[2], nom: p[1] }; });
    h += '<section class="carte"><h2>Répartition</h2><div class="duo">' + anneau(parts, ke(A.total), '4 poches', 150)
      + '<div class="leg-v">' + parts.map(function (p) { return '<div><i style="background:' + p.c + '"></i><span>' + p.nom + '</span><b>' + eur(p.v, 0) + '</b><em>' + n(A.total ? p.v / A.total * 100 : 0, 0) + ' %</em></div>'; }).join('') + '</div></div></section>';
    // patrimoine : le grand chiffre du PC (Net / Brut / Financier) et sa courbe
    if (J.accueil) {
      var rel = Ac.releve[vue], pre = Ac.precedent[vue], est = Ac.estime[vue];
      h += '<section class="carte"><div class="seg">' + ['net', 'brut', 'financier'].map(function (k) { return '<button data-vue="' + k + '" class="' + (vue === k ? 'on' : '') + '">' + { net: 'Net', brut: 'Brut', financier: 'Financier' }[k] + '</button>'; }).join('') + '</div>'
        + '<h2 style="margin-top:12px">Patrimoine ' + vue + '</h2><div class="gros" style="font-size:32px">' + eur(rel, 0) + '</div>'
        + '<div class="sous"><span class="' + cls(rel - pre) + '" style="font-weight:650">' + eurS(rel - pre, 0) + '</span> sur 1 mois · estimé aujourd’hui <b>' + eur(est, 0) + '</b></div>';
      var serie = vue === 'financier' ? Hc.map(function (x) { return { iso: x.iso, y: x.total }; }) : Hp.map(function (x) { return { iso: x.iso, y: vue === 'net' ? x.net : x.brut }; });
      if (serie.length > 1) h += courbe(serie, { couleur: '#7cc4ff', h: 140, zero: vue !== 'net' || serie.every(function (x) { return x.y >= 0; }) });
      h += '</section>';
    }
    // couloir 2032 : où il est dans la bande, et les prochains caps
    if (Bc.horizons) {
      var pos = Bc.position == null ? null : Math.max(0, Math.min(100, Bc.position));
      h += '<section class="carte"><h2>Couloir 2032</h2><div class="couloir"><i style="left:' + (pos == null ? 0 : pos) + '%"></i></div><div class="couloir-l"><span>borne basse</span><span>borne haute</span></div>'
        + '<div class="sous"><b>' + esc(String(Bc.positionTexte || '—').split(' · ')[0]) + '</b>' + (Bc.jalonAnnee ? ' · fin ' + Bc.jalonAnnee.annee + ' : ' + esc(Bc.jalonAnnee.statut) : '') + '</div>'
        + Bc.horizons.map(function (x) { return ligne(esc(x.horizon) + ' · ' + esc(mois(x.iso)), eur(x.basse, 0) + ' – ' + eur(x.haute, 0)); }).join('') + '</section>';
    }
    // mes poches, à déplier

      + Dp.enveloppes.map(function (e) { return ligne(esc(e.nom), eur(e.ceMois, 0), 'budget ' + eur(e.budget, 0)); }).join('') + '</section>';
    var Tr = S.trading;
    h += '<section class="carte">' + titre('trading', 'Trading', 'cette année') + '<div class="val ' + cls(Tr.annee) + '">' + eurS(Tr.annee, 0) + '</div>'
      + barres(Tr.mois.map(function (m) { return m.pnl; }), Tr.mois.map(function (m) { return court(m.iso); }), function (v) { return v >= 0 ? '#30d158' : '#ff453a'; })
      + '<div class="sous">Série verte : <b>' + Tr.serieVerte + ' mois</b></div></section>';
    var Rg = S.regularite, Rc = S.records;
    h += '<div class="grille2"><section class="carte">' + titre('regularite', 'Régularité') + '<div class="val">' + n(Rg.pct, 0) + '<small>%</small></div><div class="sous">' + Rg.jours + ' jours avec un mouvement sur ' + Rg.ecoules + '</div></section>'
      + '<section class="carte">' + titre('records', 'Record') + '<div class="val">' + (Rc.meilleurMois ? eurS(Rc.meilleurMois.gain, 0) : '—') + '</div><div class="sous">meilleur mois du capital' + (Rc.meilleurMois ? ' · ' + esc(Rc.meilleurMois.mois) : '') + '</div></section></div><div style="height:12px"></div>';
    if (F) h += '<section class="carte">' + titre('frais', 'Frais', String(F.an)) + '<div class="val">' + eur(F.total) + '</div>' + (F.pctCrypto != null ? '<div class="sous">Crypto : <b>' + n(F.pctCrypto, 2) + ' %</b> de tes achats</div>' : '')
      + F.lignes.map(function (x) { return ligne(esc(x.poste), eur(x.montant) + (x.estime ? '<em>estimé</em>' : '')); }).join('') + '</section>';
    if (S.cycle) h += '<section class="carte">' + titre('liquidite', 'Cycle de paie') + '<div class="val">J' + S.cycle.creuxJour + '</div><div class="sous">jour du cycle où tes comptes sont au plus bas (moyenne de ' + S.cycle.cycles + ' cycles)</div></section>';
    return h;
  }

  /* ── Mois : le point du mois (08/11/2026, idées de la vidéo « Road to 100 000 € ») ── */
  var COUL_P = { banque: '#8d929c', crypto: '#f6a623', pea: '#2bb3a3', epargne: '#8e6bdb', trading: '#40c8e0' };
  function moisOnglet() {
    var RP = J.reperes;
    if (!RP) return '<div class="vide">Ouvre le Command Center sur le PC une fois pour publier cette page.</div>';
    var h = '', P = RP.pontEnCours || RP.pontMoisFini;
    if (P) {
      var lignes = [['Versé', P.versements], ['Marché', P.marche], ['Frais', -P.frais]], mx = Math.max(1, Math.abs(P.variation), Math.abs(P.versements), Math.abs(P.marche), P.frais);
      var pb = function (v) { return '<div class="pb"><i style="' + (v >= 0 ? 'left:50%;background:var(--pos)' : 'right:50%;background:var(--neg)') + ';width:' + (Math.abs(v) / mx * 50).toFixed(1) + '%"></i></div>'; };
      h += '<section class="carte"><h2>Pont du capital<em>' + (P.enCours ? 'depuis le ' + jour(P.debut) : jour(P.debut) + ' → ' + jour(P.fin)) + '</em></h2>'
        + '<div class="gros" style="font-size:32px"><span class="' + cls(P.variation) + '">' + eurS(P.variation, 0) + '</span></div><div class="sous">' + eur(P.depart, 0) + ' → <b>' + eur(P.arrivee, 0) + '</b></div>'
        + '<div style="margin-top:10px">' + lignes.map(function (l) { return '<div class="pont-l"><span>' + l[0] + '</span>' + pb(l[1]) + '<b class="' + cls(l[1]) + '">' + eurS(l[1]) + '</b></div>'; }).join('')
        + '<div class="pont-l tot"><span>Variation</span>' + pb(P.variation) + '<b>' + eurS(P.variation) + '</b></div></div>'
        + (P.interne ? '<p class="note">Entre poches : ' + eur(P.interne) + ' du trading vers le Livret A (sans effet sur le total).</p>' : '')
        + pli('Poche par poche', '', '', P.poches.map(function (x) { return ligne(esc(x.nom), '<span class="' + cls(x.variation) + '">' + eurS(x.variation) + '</span>', 'versé ' + eurS(x.versements - (x.interne || 0), 0) + ' · marché ' + eurS(x.marche, 0) + (x.frais ? ' · frais ' + eur(x.frais) : '')); }).join('')) + '</section>';
    }
    // contre le MSCI World
    var Cu = RP.cumul || {}, Ps = RP.ponts || [];
    var pc = function (v) { return v == null ? '<span class="dim">—</span>' : '<span class="' + cls(v) + '">' + pct(v) + '</span>'; };
    h += '<section class="carte"><h2>Contre le MSCI World<em>hors versements</em></h2>'
      + (Cu.nbMois ? '<div class="duo"><div><div class="kpi"><span>PEA + crypto</span><b class="' + cls(Cu.marches) + '">' + pct(Cu.marches) + '</b></div></div><div><div class="kpi"><span>MSCI World</span><b class="' + cls(Cu.msciWorld) + '">' + pct(Cu.msciWorld) + '</b></div></div><div><div class="kpi"><span>PEA seul</span><b class="' + cls(Cu.pea) + '">' + pct(Cu.pea) + '</b></div></div></div>'
        + '<div class="sous">depuis le ' + date(Cu.du) + ' · ' + Cu.nbMois + ' mois enchaînés</div>' : '<div class="sous">Pas encore assez de cours du MSCI World.</div>')
      + '<table class="perf-t"><tr><th>Mois</th><th>Capital</th><th>PEA+cr.</th><th>PEA</th><th>World</th></tr>'
      + Ps.slice().reverse().map(function (x) { return '<tr><td>' + (x.enCours ? 'en cours' : court(x.fin) + ' ' + String(x.fin).slice(2, 4)) + '</td><td>' + pc(x.perf.capital) + '</td><td>' + pc(x.perf.marches) + '</td><td>' + pc(x.perf.pea) + '</td><td>' + pc(x.perf.msciWorld) + '</td></tr>'; }).join('')
      + '</table><p class="note">Ce que l’argent a rapporté sans compter tes versements, frais déduits. Le MSCI World = la même somme placée en WPEA. Un mois seul ne veut rien dire.</p></section>';
    // mouvements du mois
    var Mv = RP.mouvements, T = Mv.totaux;
    h += '<section class="carte"><h2>Mouvements de ' + moisNom(Mv.mois) + '<em>' + T.nb + '</em></h2>'
      + '<div class="grille3" style="margin:0 0 6px"><div class="kpi"><span>Rentrées</span><b>' + ke(T.rentrees) + '</b></div><div class="kpi"><span>Placé</span><b>' + ke(T.versesPlacements) + '</b></div><div class="kpi"><span>Entre poches</span><b>' + ke(T.interne) + '</b></div></div>'
      + (Mv.lignes.length ? Mv.lignes.map(function (l) { return '<div class="mv"><i style="background:' + (COUL_P[l.poche] || '#8d929c') + '"></i><div>' + esc(l.quoi) + '<small>' + jour(l.date) + ' · ' + esc(l.de) + (l.de.indexOf('→') < 0 && l.vers ? ' → ' + esc(l.vers) : '') + '</small></div><b class="' + (l.interne ? 'dim' : '') + '">' + eurS(l.montant) + '</b></div>'; }).join('') : '<div class="sous">Rien ce mois-ci pour l’instant.</div>')
      + '</section>';
    var Mp = RP.mouvementsPrecedent;
    if (Mp && Mp.lignes.length) h += '<section class="carte">' + pli('Mouvements de ' + moisNom(Mp.mois), eur(Mp.totaux.versesPlacements, 0) + ' placés', Mp.totaux.nb + ' mouvements · rentrées ' + eur(Mp.totaux.rentrees, 0),
      Mp.lignes.map(function (l) { return '<div class="mv"><i style="background:' + (COUL_P[l.poche] || '#8d929c') + '"></i><div>' + esc(l.quoi) + '<small>' + jour(l.date) + '</small></div><b>' + eurS(l.montant) + '</b></div>'; }).join('')) + '</section>';
    var PP = RP.pontPatrimoine;
    if (PP) h += '<section class="carte"><h2>Patrimoine net<em>relevé ' + moisNom(PP.de) + ' → ' + moisNom(PP.a) + '</em></h2>'
      + ligne('Banque', '<span class="' + cls(PP.banque) + '">' + eurS(PP.banque) + '</span>') + ligne('Placements', '<span class="' + cls(PP.placements) + '">' + eurS(PP.placements) + '</span>') + ligne('Crédit remboursé', '<span class="' + cls(PP.credit) + '">' + eurS(PP.credit) + '</span>')
      + (PP.biens ? ligne('Biens', eurS(PP.biens)) : '') + ligne('<b style="color:var(--texte)">Total</b>', '<span class="' + cls(PP.net) + '">' + eurS(PP.net) + '</span>') + '</section>';
    return h;
  }
  /* Capital : paliers, répartition cible, liquidités par rôle, projet (08/11/2026) */
  function reperesCapital() {
    var RP = J.reperes; if (!RP) return '';
    /* Route des 100 000 € (08/11/2026) : un palier tous les 5 000 €, cadenas sur le prochain */
    var cap = RP.auCours || 0, x = Math.max(0, Math.min(100, cap / 1000)), pro = null, der = null;
    RP.paliers.forEach(function (p) { if (p.atteint) der = p; if (!pro && !p.atteint) pro = p; });
    var cad = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    var quand = function (p) { return p.atteint ? 'franchi en ' + mois(p.atteint) : p.franchiAuCours ? 'passé au cours, validé au prochain 10' : p.dateHaute ? 'couloir : ' + court(p.dateHaute) + ' ' + String(p.dateHaute).slice(2, 4) + (p.dateBasse && p.dateBasse !== p.dateHaute ? ' – ' + court(p.dateBasse) + ' ' + String(p.dateBasse).slice(2, 4) : '') : 'couloir : après 2032'; };
    var h = '<section class="carte"><h2>Route des 100 k€<em>un palier tous les 5 000 €</em></h2>'
      + '<div class="gros" style="font-size:30px">' + eur(cap, 0) + '<span class="dim" style="font-size:15px"> · ' + n(x, 1) + ' % du chemin</span></div>'
      + '<div class="route"><div class="r-piste"><i style="width:' + x.toFixed(2) + '%"></i>' + RP.paliers.map(function (p) {
        var c = 'r-pt' + (p.atteint || p.franchiAuCours ? ' fait' : '') + (pro && p.montant === pro.montant ? ' pro' : '') + (p.montant % 10000 === 0 ? ' gd' : '') + (p.montant === 100000 ? ' but' : '') + (p.recompense ? ' rec' : '');
        return '<span class="' + c + '" style="left:' + (p.montant / 1000) + '%">' + (pro && p.montant === pro.montant ? cad : '') + '</span>';
      }).join('') + '</div><div class="r-grad"><span>0 €</span><span>50 k€</span><span>100 k€</span></div></div>';
    if (pro) {
      var pc = Math.max(0, Math.min(100, (cap - (pro.montant - 5000)) / 50));
      h += '<div class="r-pro"><div><small>Prochain palier</small><b>' + eur(pro.montant, 0) + '</b></div><div style="text-align:right"><small>' + quand(pro) + '</small><b>' + (pro.reste > 0 ? 'reste ' + eur(pro.reste, 0) : 'passé') + '</b></div></div>'
        + barre(pc, '#f5b83d') + '<div class="r-rec' + (pro.recompense ? ' on' : '') + '">' + cad + (pro.recompense ? esc(pro.recompense) : 'récompense à choisir sur le PC') + '</div>';
    }
    if (der) h += '<div class="sous">Dernier palier franchi : <b>' + eur(der.montant, 0) + '</b> (' + mois(der.atteint) + ')' + (der.recompense ? ' · ' + esc(der.recompense) : '') + '</div>';
    h += '</section>';
    /* Watchlist et réserve d'achat (08/11/2026) : actions et prix cibles choisis par Tom sur le PC */
    var W = RP.watchlist;
    if (W) {
      var sy = function (d) { return d === 'USD' ? '$' : d === 'EUR' ? '€' : (d || ''); };
      var ST = { achat: ['#3ecf8e', 'zone d’achat'], proche: ['#f5c542', 'proche'], surveiller: ['#f59e42', 'à surveiller'], hors: ['#ef5b5b', 'hors zone'] };
      h += '<section class="carte"><h2>Watchlist<em>' + W.actions.length + ' / ' + W.places + ' places</em></h2>';
      if (!W.actions.length) h += '<div class="sous">Actions et prix cibles à choisir sur le PC (page Watchlist).' + (W.prochainePlace ? ' Une place de plus à ' + eur(W.prochainePlace, 0) + '.' : '') + '</div>';
      W.actions.forEach(function (a) {
        var st = ST[a.statut];
        h += '<div class="wl-l"><i style="background:' + (st ? st[0] : '#4a4d55') + '"></i><div><b>' + esc(a.nom) + '</b><small>' + (st ? st[1] + ' · ' + (a.ecart <= 0 ? n(-a.ecart, 1) + ' % sous ta cible' : n(a.ecart, 1) + ' % au-dessus') : 'cours à venir') + (a.var1m != null ? ' · ' + (a.var1m >= 0 ? '+' : '') + n(a.var1m, 1) + ' % sur 1 mois' : '') + '</small></div>'
          + '<div class="wl-p"><b>' + (a.cours != null ? n(a.cours, 2) + ' ' + sy(a.devise) : '—') + '</b><small>cible ' + n(a.cible, 2) + ' ' + sy(a.devise) + '</small></div></div>';
      });
      var Rv = W.reserve;
      h += '<div class="r-pro"><div><small>Réserve d’achat' + (Rv && Rv.ou ? ' · ' + esc(Rv.ou) : '') + '</small><b>' + (Rv && Rv.solde != null ? eur(Rv.solde, 0) : 'à remplir') + '</b></div><div style="text-align:right"><small>chaque mois</small><b>' + (Rv && Rv.parMois != null ? '+' + eur(Rv.parMois, 0) : '—') + '</b></div></div></section>';
    }
    var Rp = RP.repartition;
    if (Rp && Rp.choisie) h += '<section class="carte"><h2>Répartition cible<em>à ' + ke(Rp.palier) + '</em></h2>' + Rp.poches.map(function (p) {
      return ligne(esc(p.nom), n(p.pct, 0) + ' % <span class="dim">/ ' + n(p.cible, 0) + ' %</span>', (p.ecartPts >= 0 ? '+' : '') + n(p.ecartPts, 0) + ' pt · ' + eurS(p.ecartEur, 0));
    }).join('') + '</section>';
    var L = RP.liquidites;
    if (L) h += '<section class="carte">' + pli('Liquidités par rôle', eur(L.total, 0), 'à quoi sert chaque euro dispo', L.roles.filter(function (x) { return !x.vide; }).map(function (x) {
      return ligne(esc(x.role) + '<em>' + esc(x.ou) + ' · ' + esc(x.detail) + '</em>', '<span class="' + (x.montant < 0 ? 'neg' : x.horsBanque ? 'dim' : '') + '">' + eur(x.montant) + '</span>');
    }).join('') + '<p class="note">' + esc(L.note) + '</p>') + '</section>';
    var Pj = RP.projet;
    if (Pj) h += '<section class="carte"><h2>Projet · ' + esc(Pj.nom) + '<em>' + (Pj.echeance ? mois(Pj.echeance) : 'sans date') + '</em></h2><div class="gros" style="font-size:28px">' + eur(Pj.deCote, 0) + '<span class="dim" style="font-size:16px"> / ' + (Pj.montant ? eur(Pj.montant, 0) : '—') + '</span></div>'
      + barre(Pj.pct || 0, '#f5b83d') + '<div class="sous">' + (Pj.parMois != null ? '<b>' + eur(Pj.parMois, 0) + '</b> par mois pour y être' : Pj.complet ? 'prêt' : Pj.montant ? 'sans date : au Livret A, à ton rythme' : 'montant à remplir sur le PC') + '</div></section>';
    return h;
  }

  var PAGES = { capital: capital, mois: moisOnglet, situation: situation, afaire: afaire, depenses: depenses, stats: stats };
  function dessinerOnglets() {
    var nb = 0, ko = 0; try { nb = aFaireCompte(); ko = ((J && J.situation) || []).filter(function (s) { return s.niveau === 'ko'; }).length; } catch (e) { nb = 0; }
    document.getElementById('onglets').innerHTML = ONGLETS.map(function (o) {
      return '<button data-o="' + o[0] + '" class="' + (o[0] === onglet ? 'on' : '') + '"><svg viewBox="0 0 24 24">' + o[2] + '</svg>' + o[1]
        + (o[0] === 'afaire' && nb ? '<span class="pastille">' + nb + '</span>' : '') + (o[0] === 'situation' && ko ? '<span class="pastille">' + ko + '</span>' : '') + '</button>';
    }).join('');
  }
  function dessiner() {
    dessinerOnglets();
    var el = document.getElementById('page');
    el.className = 'p-' + onglet;
    document.getElementById('titre').textContent = ONGLETS.filter(function (o) { return o[0] === onglet; })[0][3];
    if (!J) return;
    if (J.erreur) { el.innerHTML = '<div class="vide">' + esc(J.erreur) + '</div>'; return; }
    try { el.innerHTML = PAGES[onglet](); } catch (e) { el.innerHTML = '<div class="vide">Cette page n’a pas pu s’afficher (' + esc(e.message) + ').</div>'; }
    document.getElementById('maj').textContent = J.genereLe ? (SOURCE ? 'Chiffres publiés ' : 'Chiffres du PC ') + depuis(J.genereLe) + (J._horsLigne ? ' · hors ligne' : '') : '';
    if (SOURCE && onglet === 'capital') el.insertAdjacentHTML('beforeend', '<div class="bas"><button data-verrouiller>Verrouiller ce téléphone</button></div>');
  }
  /* Mot de passe demandé une fois ; le téléphone garde la clé (pas le mot de passe). */
  var verrouille = false;
  function verrou(message) {
    verrouille = true;
    var page = document.getElementById('page');
    page.className = ''; document.getElementById('onglets').style.display = 'none'; document.getElementById('titre').textContent = 'Command Center';
    page.innerHTML = '<form class="verrou" id="f-verrou"><div class="logo">CC</div><h2>Tes chiffres sont chiffrés</h2><p>Entre le mot de passe choisi dans le Command Center. Ce téléphone s’en souviendra.</p>'
      + '<input type="password" id="mdp" autocomplete="current-password" placeholder="Mot de passe" required><button type="submit">Déverrouiller</button><div class="err" id="err">' + esc(message || '') + '</div></form>';
    document.getElementById('f-verrou').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('err'); err.textContent = 'Un instant…';
      cleDepuisMotDePasse(document.getElementById('mdp').value, enveloppe).then(function (cle) {
        return dechiffrer(cle, enveloppe).then(function (d) {
          stock.ecrire('cc-cle', vers64(cle)); stock.ecrire('cc-sel', enveloppe.sel);
          J = d; verrouille = false; document.getElementById('onglets').style.display = ''; dessiner();
        });
      }).catch(function () { err.textContent = 'Mot de passe incorrect.'; });
    });
  }
  function ouvrirEnveloppe(env, horsLigne) {
    enveloppe = env;
    var cle = stock.lire('cc-cle'), sel = stock.lire('cc-sel');
    if (!cle || sel !== env.sel) { verrou(cle && sel !== env.sel ? 'Le mot de passe a changé sur le PC : entre le nouveau.' : ''); return Promise.resolve(); }
    return dechiffrer(b64(cle), env).then(function (d) { J = d; J._horsLigne = horsLigne; }, function () { stock.ecrire('cc-cle', null); verrou('Entre ton mot de passe à nouveau.'); });
  }
  function charger() {
    var b = document.getElementById('rafraichir'); b.classList.add('tourne');
    if (SOURCE) {   // appli publiée : fichier chiffré sur GitHub, ou le dernier gardé si pas de réseau
      return fetch(SOURCE + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (env) {
          // une nouvelle version de l'appli est en ligne : on la recharge (une seule fois par session)
          var maVersion = (document.querySelector('meta[name="cc-version"]') || {}).content;
          var dejaRecharge = false; try { dejaRecharge = sessionStorage.getItem('cc-recharge') === env.appli; } catch (e) { /* rien */ }
          if (env.appli && env.appli !== maVersion && !dejaRecharge) {
            try { sessionStorage.setItem('cc-recharge', env.appli); } catch (e) { /* rien */ }
            location.replace(location.pathname + '?v=' + env.appli); return new Promise(function () {});
          }
          stock.ecrire('cc-dernier', JSON.stringify(env)); return ouvrirEnveloppe(env, false);
        }, function () {
          var v = stock.lire('cc-dernier');
          if (v) return ouvrirEnveloppe(JSON.parse(v), true);
          J = { erreur: 'Pas de connexion, et aucun chiffre gardé sur ce téléphone pour l’instant.' };
        })
        .then(function () { b.classList.remove('tourne'); if (!verrouille) dessiner(); });
    }
    return fetch('donnees', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) { J = d; }, function () {
      if (!J) J = { erreur: 'Le PC ne répond pas : le Command Center est-il ouvert, et es-tu sur le Wi-Fi de la maison ?' };
      document.getElementById('maj').textContent = 'PC injoignable';
    }).then(function () { b.classList.remove('tourne'); dessiner(); });
  }
  document.getElementById('onglets').addEventListener('click', function (e) {
    var t = e.target.closest('[data-o]'); if (!t) return;
    onglet = t.getAttribute('data-o'); try { localStorage.setItem('cc-tel-onglet', onglet); } catch (x) { /* rien */ }
    window.scrollTo(0, 0); dessiner();
  });
  document.getElementById('rafraichir').addEventListener('click', function () { if (!verrouille) charger(); });
  document.getElementById('page').addEventListener('click', function (e) {
    var sit = e.target.closest('.sit[data-o]');   // Situation : un point mène à l'onglet où regarder
    if (sit && PAGES[sit.getAttribute('data-o')]) { onglet = sit.getAttribute('data-o'); try { localStorage.setItem('cc-tel-onglet', onglet); } catch (x) { /* rien */ } window.scrollTo(0, 0); dessiner(); return; }
    if (e.target.closest('[data-verrouiller]')) { stock.ecrire('cc-cle', null); stock.ecrire('cc-dernier', null); location.reload(); }
    var v = e.target.closest('[data-vue]');
    if (v) { vue = v.getAttribute('data-vue'); stock.ecrire('cc-vue', vue); dessiner(); }
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !verrouille) charger(); });
  setInterval(function () { if (!document.hidden && !verrouille) charger(); }, 60000);
  dessinerOnglets(); charger();
})();
</script>
